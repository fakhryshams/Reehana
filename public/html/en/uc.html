<!DOCTYPE html>
<html>
<head>
	<title>COMING SOON | REEHANA</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
	<link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600" rel="stylesheet">
<link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
<link rel="icon" href="/favicon.png" type="image/x-icon">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">
	<style type="text/css">
		body{
			margin: 0;
			padding: 0;
			font-family: 'Source Sans Pro', sans-serif;
			font-weight: normal;
		}
		.background-layer{
			height: 100%;
			width: 100%;
			background-repeat: no-repeat;
			background-size: cover;
			background-position: center;
			background-image: url(../images/coming-soon.jpg);
		}
		.coming-soon{
			display: table;
			width: 100%;
			height: 100vh;
			vertical-align: middle;
			background-color: rgba(0,0,0,0);

		}
		.coming-soon .table-cell{
			display: table-cell;
			vertical-align: middle;
			text-align: center;
			color: #FFFFFF;
			padding: 0 15px;
		}
		.title{
			font-size: 3.2em;
			font-weight: 600;
			text-transform: uppercase;
			margin-bottom: 20px;
		}
		.title .logo{
			background-color: #FFF;
			padding: 15px;
			border-radius: 3px;
			box-shadow: 0 1px 3px rgba(0,0,0,.15);
			vertical-align: top;
		}
		.line{
			display: block;
			height: 2px;
			width: 70%;
			margin: 20px auto;
			background-color: #FFFFFF;
			box-shadow: none;
			border: none;
		}
		.discription{
			font-size: 29px;
			line-height: 1.2;
			margin: 0 0 20px;
			color: #717171;
		}
		.info{
			font-size: 18px;
			margin: 0;
			color: #717171;
		}
		.info a{
			color: #717171;
			outline: none;
			border-bottom: 1px solid #FFFFFF;
			text-decoration: none;
		}
		@media screen and (max-width: 460px){
			.title{
				font-size: 24px;
			}
			.discription{
				font-size: 20px;
			}
			.info {
				font-size: 14px;
				line-height: 1.5;
			}
		}
	</style>
</head>
<body>
<div id="preloader">
	<img src="../img/loader.gif">Loading...
</div>
	<div class="background-layer">
		<div id="coming-soon" class="coming-soon">
			<div class="table-cell">
				<div class="title">
					<img class="logo" src="../images/logo.png" title="REEHANA">
				</div>
				<dd class="discription">Coming Soon</dd>
				<p class="info">We are available on<br>WhastApp : <a href="tel:+966-508916988">+966-508916988</a><br>Instagram <a href="https://www.instagram.com/theartofgiving.sa" target="_blank">@theartofgiving.sa</a></p>
			</div>
		</div>
	</div>
</body>
</html>
